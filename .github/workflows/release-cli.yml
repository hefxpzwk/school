name: Release CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build one-file CLI
        run: pyinstaller --onefile --name sch neis_meal_cli.py

      - name: Rename binary with OS suffix
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/sch.exe dist/sch-${{ matrix.os }}.exe
          else
            mv dist/sch dist/sch-${{ matrix.os }}
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sch-${{ matrix.os }}
          path: |
            dist/sch-${{ matrix.os }}
            dist/sch-${{ matrix.os }}.exe

  release:
    name: Publish GitHub Release assets
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Make checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          artifacts_dir = Path("artifacts")
          lines = []
          for file_path in sorted(artifacts_dir.rglob("*")):
              if not file_path.is_file():
                  continue
              digest = hashlib.sha256(file_path.read_bytes()).hexdigest()
              rel = file_path.relative_to(artifacts_dir)
              lines.append(f"{digest}  {rel.as_posix()}")

          output = artifacts_dir / "SHA256SUMS.txt"
          output.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/sch-ubuntu-latest
            artifacts/**/sch-macos-latest
            artifacts/**/sch-windows-latest.exe
            artifacts/SHA256SUMS.txt
